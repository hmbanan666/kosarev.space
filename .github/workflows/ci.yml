name: CI

on:
  push:
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '!.github/workflows/ci.yml'
    branches:
      - main
  pull_request:
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '!.github/workflows/ci.yml'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kosarev_test
          POSTGRES_PASSWORD: kosarev_test
          POSTGRES_DB: kosarev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kosarev_test -d kosarev_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NUXT_DATABASE_URL: postgresql://kosarev_test:kosarev_test@127.0.0.1:5432/kosarev_test
      CASE_CONTENT_TEST_DATABASE_URL: postgresql://kosarev_test:kosarev_test@127.0.0.1:5432/kosarev_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Bootstrap pinned pnpm
        run: |
          npm install --global --prefix "$PWD/.cache/tooling" --allow-scripts=pnpm "$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          echo "$GITHUB_WORKSPACE/.cache/tooling/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Case content transactions
        run: pnpm run test:content

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build
